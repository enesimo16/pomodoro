services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: focus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB tanimli degil}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER tanimli degil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: focus-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD tanimli degil}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  focus-api:
    build:
      context: .
      dockerfile: backend/src/Focus.WebAPI/Dockerfile
    container_name: focus-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  focus-admin:
    build:
      context: .
      dockerfile: backend/src/Focus.Admin/Dockerfile
    container_name: focus-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5001}:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
